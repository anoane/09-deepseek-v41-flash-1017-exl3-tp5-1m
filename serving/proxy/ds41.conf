# DeepSeek-V4.1-Flash endpoint (TabbyAPI on 127.0.0.1:1920) on port 8443, since 2026-10-14.
# Replaces Caddy on this port: Caddy cut every HTTP/1.1 response at 60 s (pi speaks HTTP/1.1).
# Long prompts are read for minutes before the first byte, answers stream for many minutes: nothing is buffered
# and no timeout below an hour applies. The certificate is the one Caddy renews (Caddy now on 127.0.0.1:8444);
# nginx reloads when that file changes (nginx-cert-reload.path) and once a day (nginx-cert-reload.timer).
map $http_upgrade $connection_upgrade { default ""; websocket upgrade; }
server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/wildcard_.example.com/wildcard_.example.com.crt;
    ssl_certificate_key /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/wildcard_.example.com/wildcard_.example.com.key;
    return 444;
}
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name ds4.example.com;
    ssl_certificate     /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/wildcard_.example.com/wildcard_.example.com.crt;
    ssl_certificate_key /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/wildcard_.example.com/wildcard_.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    access_log /var/log/nginx/ds41_access.log;
    error_log  /var/log/nginx/ds41_error.log warn;
    client_max_body_size 512m;
    client_body_timeout 10m;
    client_header_timeout 60s;
    keepalive_timeout 10m;
    send_timeout 1h;
    location / {
        proxy_pass http://127.0.0.1:1920;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no always;
    }
}
